; shell/xonsh（xonsh の設定）と、そのテストの型の確認。xonsh を動かす Python で確かめる。
;   mypy --config-file shell/xonsh/mypy.ini   （リポジトリの直下で。tests/run.sh mypy-xonsh）
[mypy]
python_version = 3.14
files = shell/xonsh, tests/xonshrc
mypy_path = tests, shell/xonsh
; xontrib は名前空間パッケージ（__init__.py がない）なので、mypy_path を起点にモジュール名を決める
explicit_package_bases = True
strict = True
cache_dir = /tmp/.mypy_cache-xonsh
; xonsh には型情報がないので、xonsh の関数は型のないまま呼ぶ
untyped_calls_exclude = xonsh

; xonsh には型情報（py.typed）がない
[mypy-xonsh.*]
ignore_missing_imports = True
