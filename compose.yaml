# テスト用のコンテナ。
#   - リポジトリは読み取り専用でマウントする（テストがリポジトリを書き換えないことの確認も兼ねる）。
#   - ネットワークは使えない（テストが外部にアクセスしないことの確認も兼ねる。イメージのビルドは使える）。
#
#   docker compose run --rm debian    # Debian で shellcheck, ruff, pytest
#   docker compose run --rm fedora    # Fedora で shellcheck, ruff, pytest
#   docker compose run --rm py39      # Python 3.9 で mypy, pytest
#   docker compose run --rm debian sh tests/run.sh pytest                     # 一部だけ
#   docker compose run --rm debian python3 -m pytest tests/test_links.py -k backup
#   docker compose build              # イメージを作り直す（requirements.txt を変えたとき）
#
# 実際にダウンロードしてインストールを試すときは、ネットワークありで同じイメージを使う:
#   docker run --rm -u root -v "$PWD:/dotfiles:ro" dotfiles-debian sh -c 'HOME=$(mktemp -d) sh install.sh all'

x-common: &common
  volumes:
    - .:/dotfiles:ro
  network_mode: none

services:
  debian:
    <<: *common
    build:
      context: tests/docker
      dockerfile: debian.Dockerfile

  fedora:
    <<: *common
    build:
      context: tests/docker
      dockerfile: fedora.Dockerfile

  py39:
    <<: *common
    build:
      context: tests/docker
      dockerfile: py39.Dockerfile
