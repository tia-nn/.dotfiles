# インストーラ（installer/）と xonsh の設定（shell/xonsh/）の開発ツールの設定。パッケージとして配布はしない。

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "shell/xonsh"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py39"
line-length = 110
include = ["install.py", "links.py", "packages.py", "installer/**/*.py", "tests/**/*.py", "shell/xonsh/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["installer", "xontrib.dotfiles"]

[tool.mypy]
python_version = "3.9"
files = ["install.py", "links.py", "packages.py", "installer", "tests", "shell/xonsh"]
strict = true
mypy_path = ["tests", "shell/xonsh"]
# shell/xonsh/xontrib は名前空間パッケージ（__init__.py がない）なので、mypy_path を起点にモジュール名を決める
explicit_package_bases = true
cache_dir = "/tmp/.mypy_cache"

[[tool.mypy.overrides]]
# xonsh には型情報（py.typed）がなく、Python 3.9 のテスト環境には xonsh も prompt_toolkit も入っていない。
# XonshSession などは Any として扱う
module = ["xonsh", "xonsh.*", "prompt_toolkit", "prompt_toolkit.*"]
ignore_missing_imports = true
