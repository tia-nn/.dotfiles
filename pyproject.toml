# インストーラ（installer/）と xonsh の設定（shell/xonsh/）の開発ツールの設定。パッケージとして配布はしない。

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "shell/xonsh"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py39"
line-length = 110
include = ["install.py", "links.py", "installer/**/*.py", "tests/**/*.py", "shell/xonsh/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["installer", "lib"]

[tool.ruff.lint.per-file-ignores]
# xonsh の rc は、未定義の名前や使っていない import などの誤りだけを確認する（F）
"shell/xonsh/rc.d/*.py" = ["E", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
# shell/xonsh/rc.d は xonsh の中で動くので対象外。lib/ はテストからの import をたどって確認する
files = ["install.py", "links.py", "installer", "tests"]
strict = true
mypy_path = ["tests", "shell/xonsh"]
cache_dir = "/tmp/.mypy_cache"
