# インストーラ（installer/）の開発ツールの設定。パッケージとして配布はしない。

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py39"
line-length = 110
include = ["install.py", "links.py", "installer/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
files = ["install.py", "links.py", "installer", "tests"]
strict = true
mypy_path = ["tests"]
cache_dir = "/tmp/.mypy_cache"
